services:
  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "web:80"]   # --url=<domain> is added via NGROK_DOMAIN in Phase 5
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "127.0.0.1:4040:4040"     # ngrok inspector, host-only
    depends_on:
      - web
    restart: unless-stopped

# Phase 2 (decisions/004): add `api` and `db` services under `profiles: [backend]`.
